# Airflow con LocalExecutor (sin Redis/Celery: el volumen de dominios de
# este proyecto no lo justifica) + dbt en un venv aislado dentro de la
# misma imagen (Dockerfile). docker-compose oficial, no Astronomer CLI,
# para tener el mismo artefacto en el laboratorio y en las VMs de
# producción en GCP.
#
# Variables esperadas en .env (ver .env.example): AIRFLOW_UID,
# AIRFLOW_FERNET_KEY, AIRFLOW_WEBSERVER_SECRET_KEY, AIRFLOW_ADMIN_USERNAME,
# AIRFLOW_ADMIN_PASSWORD, AIRFLOW_ADMIN_EMAIL, POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB, GOOGLE_APPLICATION_CREDENTIALS (la misma
# variable que ya usa dlt -- ver .env.example sección 6 -- pero con la ruta
# generada por `gcloud auth application-default login` corrido en VM-02,
# no la de VM-01).
#
# El repo completo se monta en /opt/airflow/project: la DAG factory
# (airflow/dags/medallion_dag_factory.py) resuelve PROJECT_ROOT a partir de
# su propia ruta dentro del contenedor, así que necesita ver `sources/` y
# `dbt/` en la misma posición relativa que en el repo real.
#
# El archivo ADC se monta en la MISMA ruta que tiene en el host (no se
# traduce a una ruta fija dentro del contenedor) para que
# GOOGLE_APPLICATION_CREDENTIALS sirva sin modificar su valor -- sin esto,
# `dbt run` dentro del contenedor no encuentra credenciales y falla.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
  volumes:
    - .:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs
    - ./airflow/keys:/opt/airflow/keys:ro
    - ${GOOGLE_APPLICATION_CREDENTIALS}:${GOOGLE_APPLICATION_CREDENTIALS}:ro
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:?Definir AIRFLOW_ADMIN_PASSWORD en .env}" \
          --firstname admin --lastname admin --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
